name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20

      matrix:
        example:
          - FlashDemo

        unit:
          - UnitFlashLight

        # Reduced to compile-config representatives (SoC x Arduino platform).
        # AW3641E is a GPIO 1-wire driver with minimal board-specific variance;
        # the active boards below cover all SoC + platform combinations used
        # in the library. Commented boards are covered by env in platformio.ini
        # for local `pio run -e ...`; re-enable in CI if a board-specific
        # regression appears.
        board:
          - Core          # espressif32 x ESP32 (Xtensa dual)
#          - Core2
          - CoreS3        # espressif32 x ESP32-S3 (Xtensa dual + PSRAM + USB-OTG)
#          - Fire
#          - StampS3
#          - Dial
#          - Atom
#          - AtomS3
#          - AtomS3R
          - NanoC6        # pioarduino x ESP32-C6 (RISC-V)
          - NanoH2        # pioarduino x ESP32-H2 (RISC-V, lowest clock)
#          - StickCPlus
          - StickCPlus2   # custom board json + variant override
#          - StickS3
#          - Paper
#          - CoreInk
#          - Cardputer
          - Tab5          # pioarduino x ESP32-P4 (RISC-V + non-standard partition)
          - NessoN1       # non-M5 form factor (Arduino UNO compatible)

        framework:
          - Arduino

        espressif32:
          - latest

        # Single Core build with -DUSE_TORCH_DEMO to compile-check the torch path.
        include:
          - unit: UnitFlashLight
            example: TorchDemo
            board: Core
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
