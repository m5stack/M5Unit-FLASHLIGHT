; UnitTest
; --------------------------------
[env:test_UnitAW3641E_Core]
extends=Core, option_release, arduino_latest
lib_deps = ${Core.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_aw3641e

